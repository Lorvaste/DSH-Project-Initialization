# 插件壳：启动时把包内 presets/ 同步到用户 .agent-presets
#
# 官方第三方 preset 插件范式（参照 @linxin666/dsh-liangshen）：
# 不配置 agent-presets roots（roots 的 path 按进程 cwd 解析，相对路径会错位），
