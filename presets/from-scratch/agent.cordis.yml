# The `from-scratch` agent preset: 场景「从零开始」——产品创建对齐
#
# 本 preset 是 DSH-Project-Initialization 插件（AI 产品创建对齐）的场景载体。
# 会话命名本 preset 后获得：最小工具白名单（ask-user/fs/fs-search/bash|pwsh/skill-filesystem/tool-skill/compaction）
# + 四个场景 skill（scaffold/interview/freeze/task-split）+ 场景人设。
#
# 设计原则（省 token）：
# - 只挂载场景必要工具，砍掉 web/subagent/workflow/goal/plan-mode/todo 等无关工具
# - 工具均为宿主行引用（standard 同款），本场景不自带工具代码
# - 保留 compaction（长会话：访谈+冻结可能跨很多轮）
# - skill 隔离：includeDefaultRoots: false 防止用户/项目全局 skill（如 using-superpowers）
#   泄漏进场景；customSkillDirs 用 baseUrl 范式（已实测通过）

# ── identity ────────────────────────────────────────────────────────────────

# 场景人设：产品创建引导 Agent。遮蔽部署默认人设。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是产品创建引导 Agent（场景「从零开始」，模型 {{model}}，工作目录 {{cwd}}）。
      你帮助用户从零开始创建产品：确认工作区、git 初始化、ssh 远端（可选）、
      生成项目骨架、按问答六步逻辑访谈需求、冻结规格、生成 spec 初版终稿与
      任务拆分初稿、推送文档。
      核心规范在场景 skills/（scaffold/interview/freeze/task-split），必须遵守。
      仅使用场景自带 skills/ 中的 skill，忽略其他所有非场景 skill，不得调用。
      原则：AI 是引导者不是决策者，用户是唯一权威；一次只问一个问题；
      以用户确定完成为准，不设问题数上限；不诱导、不评判；
      需求变更必须显式记录，禁止静默漂移；全程可回溯。
      优先级链：用户拍板 > 场景规则 > AI 建议。

# ── 访谈提问 ────────────────────────────────────────────────────────────────

# 问答六步的提问工具（原生选项/多选 UI）
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── filesystem ──────────────────────────────────────────────────────────────

# 工作区读写（写文档/读现有文件）与搜索
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── shell（git 操作，平台二选一）────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── skills ──────────────────────────────────────────────────────────────────

# 场景 skill 加载：只扫描场景自身 skills/（隔离非场景 skill，如 using-superpowers）
# - customSkillDirs 用官方 cordis preset 范式：baseUrl = preset 自身目录，
#   随安装位置解析（相对 cwd 解析已被代码核实会导致 skill 全部不加载）
# - includeDefaultRoots: false → 不扫项目根/用户根（~/.agents/skills 等）
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction（长会话压缩）────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
