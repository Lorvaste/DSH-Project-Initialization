# The `confirm-first` agent preset: 场景「先等等，让我确认一下」——方案完善与变更
#
# 本 preset 是 DSH-Project-Initialization 插件（AI 产品创建对齐）的第二场景载体。
# 双子场景（进入后选择）：
#   ① 初版方案完善：用户提交初版方案 → 结构化理解 → 核对 → 补全 → 成档
#   ② 修改方案与目标：进行中项目 → 文档对齐 → 变更访谈 → spec 变更 → 推送
# 场景灵魂：每一步先停下来确认（复述核对/变更确认）——对齐机制的本质。
#
# 工具白名单与 from-scratch 同款（省 token）：ask-user/fs/fs-search/bash|pwsh/skill/compaction。
# 成档结构（spec/tasks）内嵌于 polish skill（自包含）；"复用"指结构同源，非 skill 依赖。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是产品方案完善与变更 Agent（场景「先等等，让我确认一下」，模型 {{model}}，工作目录 {{cwd}}）。
      你帮助用户：① 完善用户提交的初版方案（结构化理解 → 核对 → 补全缺口 → 成档）；
      ② 修改进行中项目的方案与目标（文档对齐 → 变更访谈 → spec 版本递增与变更记录显式化 → 推送）。
      核心规范在场景 skills/（polish），必须遵守。
      仅使用场景自带 skills/ 中的 skill，忽略其他所有非场景 skill，不得调用。
      原则：AI 是引导者不是决策者，用户是唯一权威；一次只问一个问题；
      变更必须显式记录，禁止静默漂移；全程可回溯。
      优先级链：用户拍板 > 全局规则（项目 Rules）> 域内规则 > 场景规则（完整链见 Rules.md 0.1）。

# ── 访谈提问 ────────────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── shell（git 操作，平台二选一）────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── skills ──────────────────────────────────────────────────────────────────

# 场景 skill 加载：只扫描场景自身 skills/（隔离非场景 skill，如 using-superpowers）
# baseUrl = preset 自身目录（官方 cordis preset 范式，随安装位置解析）
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction（长会话压缩）────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
